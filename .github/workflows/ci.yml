name: ci

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret scan (tf2_ keys, .env, dataset files)
        run: python scripts/check_secrets.py --all

      - name: Install lightweight tooling
        run: pip install pyyaml jsonschema ruff

      - name: Lint
        run: ruff check .

      - name: Verify spec and schemas (dataset is not in the public repo)
        run: python scripts/verify_assets.py --no-data

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify frozen model, API contract, jobs and regression tests
        run: python -m pytest -m "not slow" --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
