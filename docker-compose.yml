# Local stand-in for the 2 vCPU / 4 GB host. The key comes from the environment
# or a gitignored .env file. It is not written into the image.
services:
  tensorforge:
    image: tensorforge:dev
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - tf_data:/data
    restart: unless-stopped

volumes:
  tf_data:
